<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子名刺 | alicia0901</title>
<meta name="description" content="alicia0901の電子名刺。業務システム開発(予約システム・自動化)が得意な個人開発者。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-page">
  <a class="back-link" href="index.html">← ポートフォリオに戻る</a>

  <div class="business-card">
    <div class="bc-avatar"><span>A</span></div>
    <h1 class="bc-name">alicia0901</h1>
    <p class="bc-handle">@alicia0901</p>
    <p class="bc-title">業務システム開発(予約システム・自動化)が得意な個人開発者</p>

    <hr class="bc-divider">

    <div class="bc-tags">
      <span>Google Apps Script</span>
      <span>Python</span>
      <span>業務自動化</span>
      <span>予約システム</span>
    </div>

    <div class="bc-contact">
      <a href="mailto:guraddo09@gmail.com">📧 guraddo09@gmail.com</a>
    </div>

    <div class="bc-actions">
      <button type="button" class="btn btn-primary" id="shareBtn">🔗 名刺を共有する</button>
      <a class="btn btn-secondary" href="index.html">ポートフォリオを見る →</a>
      <a class="btn btn-secondary" href="assets/alicia0901.vcf" download>連絡先を保存 (vCard)</a>
    </div>

    <div class="bc-qr">
      <div class="bc-qr-frame">
        <img src="assets/card-qr.png" alt="この名刺ページへのQRコード" width="130" height="130">
      </div>
      <span>相手にこのQRを見せて読み取ってもらう</span>
    </div>

    <p class="bc-stamp">alicia0901.github.io/portfolio</p>
  </div>
</div>

<script>
(function(){
  var CARD_URL = "https://alicia0901.github.io/portfolio/card.html";
  var btn = document.getElementById("shareBtn");
  var originalLabel = btn.textContent;
  var resetTimer = null;

  function showFeedback(label){
    clearTimeout(resetTimer);
    btn.textContent = label;
    resetTimer = setTimeout(function(){ btn.textContent = originalLabel; }, 2200);
  }

  btn.addEventListener("click", async function(){
    var shareData = {
      title: "alicia0901 | 電子名刺",
      text: "業務システム開発(予約システム・自動化)が得意な個人開発者です。",
      url: CARD_URL
    };

    // スマホ等、共有シート(LINE/メール/メッセージ等)が使える場合はそちらを優先
    if(navigator.share){
      try{
        await navigator.share(shareData);
      }catch(err){
        // ユーザーがキャンセルした場合などは何もしない
      }
      return;
    }

    // 共有シートが無い環境(主にPCブラウザ)はリンクをクリップボードにコピー
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(CARD_URL);
        showFeedback("✅ リンクをコピーしました");
        return;
      }catch(err){
        // フォールバックへ
      }
    }

    window.prompt("このリンクをコピーして渡してください", CARD_URL);
  });
})();
</script>

</body>
</html>
